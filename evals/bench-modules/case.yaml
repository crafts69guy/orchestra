schema_version: "1.1"
name: bench-modules
description: >-
  Benchmark, not a behaviour check: four independent modules from SPEC.md, big enough to
  parallelise. Graded on outcomes only (hidden acceptance tests, own tests, commits, clean tree,
  one LLM quality rubric), so the no-plugin baseline is not penalised for working serially.
  Compare score, duration and cost between arms with evals/_support/summarize.mjs.
tags: [bench]
plugins: ["../../.eval-plugin"]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  model: opus
  max_turns: 150
  timeout_seconds: 2700
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Agent, Skill]
  prompt: |
    Implement the four modules described in SPEC.md on this branch (feat/x), each with your own
    tests as SPEC.md describes. Land each module as its own commit on feat/x. Run `sh check.sh`
    as the very last step.
# Weights (outcomes total 13): the hidden acceptance suite is the main correctness signal (8, two
# tiers per module so a near miss still counts); the LLM rubric covers what tests cannot (2, lower
# because one noisy judge); own tests green, one commit per module and a clean tree are hygiene (1
# each). The three no-peek-* graders are guards, not outcomes (see AGENTS.md "Benchmark"):
# summarize.mjs drops them from the score and drops any run that failed one as invalid.
graders:
  # Hidden-suite peeking cannot be blocked in the sandbox, so it is detected. input_match runs
  # against the JSON of each tool input (subagents' calls included). Only touching the hidden suite
  # (acceptance.tgz / .git/acceptance) matches; reading check.sh is normal orientation (both arms did
  # it in the first bench-large run) and running `sh check.sh` is the expected last step.
  - name: no-peek-bash
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:acceptance\.tgz|\.git/acceptance)'
    min: 0
    max: 0
    weight: 1
    arm: both
  - name: no-peek-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*acceptance'
    min: 0
    max: 0
    weight: 1
    arm: both
  - name: no-peek-grep
    type: tool_used
    tool: Grep
    input_match: '"(?:path|glob)"\s*:\s*"[^"]*acceptance'
    min: 0
    max: 0
    weight: 1
    arm: both
  - name: acceptance-duration-80
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance duration: \d+/\d+ (?:[89]\d|100)%$'
  - name: acceptance-duration-all
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance duration: \d+/\d+ 100%$'
  - name: acceptance-semver-80
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance semver: \d+/\d+ (?:[89]\d|100)%$'
  - name: acceptance-semver-all
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance semver: \d+/\d+ 100%$'
  - name: acceptance-csv-80
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance csv: \d+/\d+ (?:[89]\d|100)%$'
  - name: acceptance-csv-all
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance csv: \d+/\d+ 100%$'
  - name: acceptance-lru-80
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance lru: \d+/\d+ (?:[89]\d|100)%$'
  - name: acceptance-lru-all
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^acceptance lru: \d+/\d+ 100%$'
  - name: own-tests-pass
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^# pass ([4-9]|\d{2,})\n# fail 0$'
  - name: four-commits
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^commit: '
    match: "count:4"
  - name: clean-tree
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^dirty: 0$'
  - name: quality-rubric
    type: llm
    weight: 2
    focus: { source: file, path: review.out }
    criteria: |
      The file is SPEC.md followed by the git diff of an agent's implementation of it. Score
      each item 0-2:
      1. Correctness: each module matches SPEC.md, including the error types it names.
      2. Edge cases: prerelease ordering, quoted/escaped/CRLF/multi-line CSV, LRU recency on get
         (not on has), malformed durations.
      3. Readability: clear names, short functions, no dead or commented-out code.
      4. Tests: every module has focused tests covering normal and edge cases.
      5. No over-engineering: no features, options, dependencies or abstractions SPEC.md does not
         ask for.
      PASS only if the total is at least 8 of 10 and no item scores 0; otherwise FAIL.
