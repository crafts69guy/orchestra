schema_version: "1.1"
name: parallel-dispatch
description: >-
  Two independent, substantial modules in disjoint files (bench-large's cron parser and expression
  evaluator, each ~100-200 reference lines). The orchestrator should plan, dispatch one
  orc:implementer per task in its own worktree, and merge each as a conventional commit.
tags: [orc]
plugins: ["../../.eval-plugin"]
runs: 1 # each run is several minutes and ~$1; bench-large covers the timing question
context:
  scaffold_script: fixture.sh
execution:
  model: opus # the production orchestrator model
  max_turns: 100
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Agent, Skill]
  prompt: |
    Implement the two modules described in SPEC.md on this branch (feat/x), each with your own
    tests as SPEC.md describes. Land each module as its own commit on feat/x. Run `sh check.sh`
    as the very last step.
graders:
  - name: plan-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:orc:)?plan"'
    arm: both
  - name: dispatch-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:orc:)?dispatch"'
    arm: both
  - name: two-implementers
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"orc:implementer"'
    min: 2
  - name: merged-via-orc-wt
    type: tool_used
    tool: Bash
    # `orc wt merge` on PATH, or the absolute `<root>/bin/orc` path (optionally quoted)
    input_match: '(?:^|[\s"/])orc(?:\\")?\s+wt\s+merge\s'
    min: 2
  - name: two-conventional-commits
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^commit: (?:feat|fix|test|refactor|perf|chore|docs)(?:\([^)]+\))?!?: \S'
    match: "count:2"
  - name: no-other-commits
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^commit: '
    match: "count:2"
  - name: on-feat-x
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^branch: feat/x$'
  - name: clean-tree
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^dirty: 0$'
  - name: no-leftover-worktrees
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^worktrees: 1$'
  - name: tests-pass
    type: regex
    target: { source: file, path: check.out }
    flags: m
    pattern: '^# pass ([4-9]|\d{2,})\n# fail 0$'
